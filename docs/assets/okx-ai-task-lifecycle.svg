<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2800 1500" width="2800" height="1500">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .title { font-size: 34px; font-weight: 700; fill: #111827; }
    .subtitle { font-size: 17px; fill: #6b7280; }
    .lane-title { font-size: 25px; font-weight: 700; fill: #111827; }
    .lane-sub { font-size: 14px; fill: #6b7280; }
    .node-title { font-size: 17px; font-weight: 700; fill: #111827; }
    .node-line { font-size: 13px; fill: #4b5563; }
    .small { font-size: 12px; fill: #6b7280; }
    .arrow-label { font-size: 12px; font-weight: 600; fill: #4b5563; }
    .legend { font-size: 14px; fill: #374151; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#9333ea"/></marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#dc2626"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#16a34a"/></marker>
  </defs>

  <rect width="2800" height="1500" fill="#ffffff"/>
  <text x="60" y="62" class="title">OKX.AI 三种任务完整生命周期</text>
  <text x="60" y="94" class="subtitle">从左向右阅读：每个节点同时标明触发来源、处理者和推进结果。实线为同步操作，虚线为异步系统事件。</text>

  <!-- lane containers -->
  <rect x="32" y="130" width="2736" height="350" rx="16" fill="#f8fbff" stroke="#bfdbfe" stroke-width="1.5"/>
  <rect x="32" y="510" width="2736" height="430" rx="16" fill="#fcfaff" stroke="#ddd6fe" stroke-width="1.5"/>
  <rect x="32" y="970" width="2736" height="430" rx="16" fill="#f8fdf9" stroke="#bbf7d0" stroke-width="1.5"/>

  <!-- lane labels -->
  <text x="60" y="205" class="lane-title">A2MCP</text>
  <text x="60" y="232" class="lane-sub">同步 Endpoint 调用</text>
  <text x="60" y="253" class="lane-sub">无 Job / 无 Watch</text>
  <text x="60" y="585" class="lane-title">A2A 单次</text>
  <text x="60" y="612" class="lane-sub">一次性交付任务</text>
  <text x="60" y="633" class="lane-sub">系统事件异步推进</text>
  <text x="60" y="1045" class="lane-title">A2A 订阅</text>
  <text x="60" y="1072" class="lane-sub">长期服务关系</text>
  <text x="60" y="1093" class="lane-sub">多次交付 + 周期事件</text>

  <!-- background arrows: A2MCP -->
  <path d="M450 270 H500" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/>
  <path d="M730 270 H780" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/>
  <path d="M1010 270 H1060" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/>
  <path d="M1290 270 H1340" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/>
  <path d="M1570 270 H1620" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/>
  <path d="M1850 270 H1900" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/>
  <path d="M1175 326 V374" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#arrow-red)"/>
  <path d="M1290 420 H1460 V326" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#arrow-green)"/>

  <!-- A2MCP nodes -->
  <g><rect x="220" y="214" width="230" height="112" rx="10" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.5"/><text x="335" y="242" text-anchor="middle" class="node-title">选择 A2MCP Service</text><text x="238" y="271" class="node-line">触发：用户意图</text><text x="238" y="294" class="node-line">处理：Buyer Agent</text><text x="238" y="317" class="node-line">结果：绑定 serviceSnapshot</text></g>
  <g><rect x="500" y="214" width="230" height="112" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="615" y="242" text-anchor="middle" class="node-title">Service 准备</text><text x="518" y="271" class="node-line">触发：已选择服务</text><text x="518" y="294" class="node-line">处理：Skill + CLI</text><text x="518" y="317" class="node-line">结果：确认 A2MCP 路由</text></g>
  <g><rect x="780" y="214" width="230" height="112" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="895" y="242" text-anchor="middle" class="node-title">Probe Endpoint</text><text x="798" y="271" class="node-line">触发：invoke_a2mcp</text><text x="798" y="294" class="node-line">处理：CLI + Endpoint</text><text x="798" y="317" class="node-line">结果：参数/支付分类</text></g>
  <g><rect x="1060" y="214" width="230" height="112" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/><text x="1175" y="242" text-anchor="middle" class="node-title">补参数 / 选候选</text><text x="1078" y="271" class="node-line">触发：Endpoint 返回</text><text x="1078" y="294" class="node-line">处理：用户 + Agent</text><text x="1078" y="317" class="node-line">结果：重新 Probe</text></g>
  <g><rect x="1340" y="214" width="230" height="112" rx="10" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.5"/><text x="1455" y="242" text-anchor="middle" class="node-title">调用 / 付款确认</text><text x="1358" y="271" class="node-line">触发：CLI 确认卡</text><text x="1358" y="294" class="node-line">处理：用户确认</text><text x="1358" y="317" class="node-line">结果：授权当前完整条件</text></g>
  <g><rect x="1620" y="214" width="230" height="112" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="1735" y="242" text-anchor="middle" class="node-title">执行 Endpoint</text><text x="1638" y="271" class="node-line">触发：明确确认</text><text x="1638" y="294" class="node-line">处理：CLI / 支付协议</text><text x="1638" y="317" class="node-line">结果：签名、付款、重放</text></g>
  <g><rect x="1900" y="214" width="230" height="112" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/><text x="2015" y="242" text-anchor="middle" class="node-title">同步结果</text><text x="1918" y="271" class="node-line">触发：Endpoint 返回</text><text x="1918" y="294" class="node-line">处理：Agent 摘要</text><text x="1918" y="317" class="node-line">终点：Success/Pending/Fail</text></g>
  <g><rect x="1060" y="374" width="230" height="82" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/><text x="1175" y="403" text-anchor="middle" class="node-title">余额不足</text><text x="1078" y="430" class="node-line">用户：充值 / 换 Token / 取消</text><text x="1078" y="450" class="small">充值后用绑定 continuation 恢复</text></g>

  <!-- background arrows: A2A one-time -->
  <path d="M450 665 H500" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/>
  <path d="M730 665 H780" stroke="#9333ea" stroke-width="2" stroke-dasharray="8 5" fill="none" marker-end="url(#arrow-purple)"/>
  <path d="M1010 665 H1060" stroke="#9333ea" stroke-width="2" stroke-dasharray="8 5" fill="none" marker-end="url(#arrow-purple)"/>
  <path d="M1290 665 H1340" stroke="#9333ea" stroke-width="2" stroke-dasharray="8 5" fill="none" marker-end="url(#arrow-purple)"/>
  <path d="M1570 665 H1620" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/>
  <path d="M1850 665 H1900" stroke="#9333ea" stroke-width="2" stroke-dasharray="8 5" fill="none" marker-end="url(#arrow-purple)"/>
  <path d="M2130 665 H2180" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/>
  <path d="M1175 721 V777" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#arrow-red)"/>
  <path d="M1290 820 H1455 V721" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrow-blue)"/>
  <path d="M2295 721 V777" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#arrow-red)"/>

  <!-- one-time nodes -->
  <g><rect x="220" y="609" width="230" height="112" rx="10" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.5"/><text x="335" y="637" text-anchor="middle" class="node-title">创建确认</text><text x="238" y="666" class="node-line">触发：用户意图 + 输入</text><text x="238" y="689" class="node-line">处理：Buyer + Skill</text><text x="238" y="712" class="node-line">结果：create-task 广播</text></g>
  <g><rect x="500" y="609" width="230" height="112" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/><text x="615" y="637" text-anchor="middle" class="node-title">Created</text><text x="518" y="666" class="node-line">事件：job_created</text><text x="518" y="689" class="node-line">处理：Buyer Runtime</text><text x="518" y="712" class="node-line">结果：建会话 / Watch</text></g>
  <g><rect x="780" y="609" width="230" height="112" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/><text x="895" y="637" text-anchor="middle" class="node-title">指定 ASP</text><text x="798" y="666" class="node-line">事件：job_asp_selected</text><text x="798" y="689" class="node-line">处理：ASP Runtime</text><text x="798" y="712" class="node-line">状态：仍为 Created</text></g>
  <g><rect x="1060" y="609" width="230" height="112" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/><text x="1175" y="637" text-anchor="middle" class="node-title">ASP 决策</text><text x="1078" y="666" class="node-line">Agent：ACCEPT</text><text x="1078" y="689" class="node-line">或 NEED_PARAMS / REJECT</text><text x="1078" y="712" class="node-line">CLI：签名 + 广播</text></g>
  <g><rect x="1340" y="609" width="230" height="112" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/><text x="1455" y="637" text-anchor="middle" class="node-title">Accepted</text><text x="1358" y="666" class="node-line">事件：job_accepted</text><text x="1358" y="689" class="node-line">处理：ASP Service</text><text x="1358" y="712" class="node-line">结果：开始真实执行</text></g>
  <g><rect x="1620" y="609" width="230" height="112" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="1735" y="637" text-anchor="middle" class="node-title">交付</text><text x="1638" y="666" class="node-line">触发：Service 产出</text><text x="1638" y="689" class="node-line">处理：deliver 原子流程</text><text x="1638" y="712" class="node-line">结果：消息 + 链上提交</text></g>
  <g><rect x="1900" y="609" width="230" height="112" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/><text x="2015" y="637" text-anchor="middle" class="node-title">Submitted</text><text x="1918" y="666" class="node-line">事件：job_submitted</text><text x="1918" y="689" class="node-line">消息：deliverable_received</text><text x="1918" y="712" class="node-line">处理：乱序合并 / 评审卡</text></g>
  <g><rect x="2180" y="609" width="230" height="112" rx="10" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.5"/><text x="2295" y="637" text-anchor="middle" class="node-title">Buyer 评审</text><text x="2198" y="666" class="node-line">触发：用户决定</text><text x="2198" y="689" class="node-line">接受 → job_completed</text><text x="2198" y="712" class="node-line">拒绝 → Refund V2</text></g>
  <g><rect x="1060" y="777" width="230" height="98" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/><text x="1175" y="806" text-anchor="middle" class="node-title">参数 / 拒绝分支</text><text x="1078" y="833" class="node-line">NEED_PARAMS：最多三轮</text><text x="1078" y="856" class="node-line">REJECT：具体原因并关闭</text></g>
  <g><rect x="2180" y="777" width="510" height="98" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/><text x="2435" y="806" text-anchor="middle" class="node-title">拒绝 / 退款 / 仲裁 / 超时</text><text x="2200" y="833" class="node-line">Rejected → ASP 同意退款，或 Disputed → Evaluator Commit / Reveal</text><text x="2200" y="856" class="node-line">Completed / Close / Expired / Failed：资金结果必须由 Refund V2 核验</text></g>

  <!-- background arrows: subscription -->
  <path d="M450 1125 H500" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/>
  <path d="M730 1125 H780" stroke="#9333ea" stroke-width="2" stroke-dasharray="8 5" fill="none" marker-end="url(#arrow-purple)"/>
  <path d="M1010 1125 H1060" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/>
  <path d="M1290 1125 H1340" stroke="#9333ea" stroke-width="2" stroke-dasharray="8 5" fill="none" marker-end="url(#arrow-purple)"/>
  <path d="M1570 1125 H1620" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/>
  <path d="M1850 1125 H1900" stroke="#9333ea" stroke-width="2" stroke-dasharray="8 5" fill="none" marker-end="url(#arrow-purple)"/>
  <path d="M2130 1125 H2180" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/>
  <path d="M2015 1181 V1245 H1735 V1181" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#arrow-green)"/>
  <path d="M2295 1181 V1245" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#arrow-red)"/>

  <!-- subscription nodes -->
  <g><rect x="220" y="1069" width="230" height="112" rx="10" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.5"/><text x="335" y="1097" text-anchor="middle" class="node-title">订阅创建确认</text><text x="238" y="1126" class="node-line">触发：用户意图 + 输入</text><text x="238" y="1149" class="node-line">确认：费用/试用/自动续订</text><text x="238" y="1172" class="node-line">结果：create-subscribe</text></g>
  <g><rect x="500" y="1069" width="230" height="112" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/><text x="615" y="1097" text-anchor="middle" class="node-title">Created</text><text x="518" y="1126" class="node-line">事件：sub_open</text><text x="518" y="1149" class="node-line">接收：Buyer + ASP</text><text x="518" y="1172" class="node-line">结果：等待 ASP 决策</text></g>
  <g><rect x="780" y="1069" width="230" height="112" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/><text x="895" y="1097" text-anchor="middle" class="node-title">ASP 接受 / 拒绝</text><text x="798" y="1126" class="node-line">触发：sub_open</text><text x="798" y="1149" class="node-line">处理：ASP Runtime + Skill</text><text x="798" y="1172" class="node-line">注意：订阅无 NEED_PARAMS</text></g>
  <g><rect x="1060" y="1069" width="230" height="112" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/><text x="1175" y="1097" text-anchor="middle" class="node-title">Active</text><text x="1078" y="1126" class="node-line">Buyer：sub_created</text><text x="1078" y="1149" class="node-line">ASP：sub_asp_selected</text><text x="1078" y="1172" class="node-line">结果：启动持续 Service</text></g>
  <g><rect x="1340" y="1069" width="230" height="112" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="1455" y="1097" text-anchor="middle" class="node-title">Service 产生信号</text><text x="1358" y="1126" class="node-line">触发：定时/市场/业务事件</text><text x="1358" y="1149" class="node-line">处理：ASP Service</text><text x="1358" y="1172" class="node-line">结果：真实周期交付物</text></g>
  <g><rect x="1620" y="1069" width="230" height="112" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="1735" y="1097" text-anchor="middle" class="node-title">持续交付</text><text x="1638" y="1126" class="node-line">处理：deliver + A2A 消息</text><text x="1638" y="1149" class="node-line">Buyer：校验并保存 Signal</text><text x="1638" y="1172" class="node-line">结果：展示/受控执行</text></g>
  <g><rect x="1900" y="1069" width="230" height="112" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/><text x="2015" y="1097" text-anchor="middle" class="node-title">周期推进</text><text x="1918" y="1126" class="node-line">事件：trial→active / renew</text><text x="1918" y="1149" class="node-line">成功：进入下一周期</text><text x="1918" y="1172" class="node-line">失败：宽限/只读核验</text></g>
  <g><rect x="2180" y="1069" width="230" height="112" rx="10" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.5"/><text x="2295" y="1097" text-anchor="middle" class="node-title">管理 / 结束</text><text x="2198" y="1126" class="node-line">用户：取消未来续费</text><text x="2198" y="1149" class="node-line">系统：complete/close/fail</text><text x="2198" y="1172" class="node-line">当前周期取消后仍有效</text></g>
  <g><rect x="2180" y="1245" width="510" height="98" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/><text x="2435" y="1274" text-anchor="middle" class="node-title">周期拒绝 / 退款 / 仲裁</text><text x="2200" y="1301" class="node-line">sub_user_reject → ASP 同意退款（sub_asp_agree）或发起仲裁</text><text x="2200" y="1324" class="node-line">sub_failed_notify 不能单独证明退款；最终资金状态由 Refund V2 核验</text></g>

  <!-- arrow labels with backgrounds -->
  <g><rect x="744" y="247" width="22" height="20" rx="4" fill="#fff" opacity="0.95"/><text x="755" y="262" text-anchor="middle" class="arrow-label">→</text></g>
  <g><rect x="738" y="642" width="34" height="20" rx="4" fill="#fff" opacity="0.95"/><text x="755" y="657" text-anchor="middle" class="arrow-label">事件</text></g>
  <g><rect x="738" y="1102" width="34" height="20" rx="4" fill="#fff" opacity="0.95"/><text x="755" y="1117" text-anchor="middle" class="arrow-label">事件</text></g>

  <!-- legend -->
  <g transform="translate(60,1435)">
    <rect x="0" y="-25" width="2680" height="52" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
    <rect x="24" y="-9" width="22" height="22" rx="5" fill="#faf5ff" stroke="#c4b5fd"/><text x="57" y="7" class="legend">用户意图/输入/确认</text>
    <rect x="255" y="-9" width="22" height="22" rx="5" fill="#eff6ff" stroke="#93c5fd"/><text x="288" y="7" class="legend">Agent / Skill / CLI 操作</text>
    <rect x="540" y="-9" width="22" height="22" rx="5" fill="#fff7ed" stroke="#fdba74"/><text x="573" y="7" class="legend">ASP 业务决策</text>
    <rect x="770" y="-9" width="22" height="22" rx="5" fill="#f0fdf4" stroke="#86efac"/><text x="803" y="7" class="legend">状态/成功阶段</text>
    <rect x="990" y="-9" width="22" height="22" rx="5" fill="#fef2f2" stroke="#fca5a5"/><text x="1023" y="7" class="legend">异常/退款/仲裁</text>
    <line x1="1245" y1="2" x2="1300" y2="2" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/><text x="1312" y="7" class="legend">同步操作</text>
    <line x1="1445" y1="2" x2="1500" y2="2" stroke="#9333ea" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#arrow-purple)"/><text x="1512" y="7" class="legend">异步系统事件</text>
    <line x1="1695" y1="2" x2="1750" y2="2" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/><text x="1762" y="7" class="legend">循环/恢复</text>
    <line x1="1935" y1="2" x2="1990" y2="2" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/><text x="2002" y="7" class="legend">异常分支</text>
    <text x="2180" y="7" class="legend">原则：事件只负责唤醒，写操作前必须重读权威状态</text>
  </g>
</svg>
