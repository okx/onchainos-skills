<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .title { font-size: 26px; font-weight: 700; fill: #111827; }
    .subtitle { font-size: 13px; fill: #6b7280; }
    .layer-title { font-size: 16px; font-weight: 700; fill: #111827; }
    .card-title { font-size: 14px; font-weight: 700; fill: #111827; }
    .body { font-size: 12px; fill: #374151; }
    .muted { font-size: 11px; fill: #6b7280; }
    .tag { font-size: 11px; font-weight: 700; }
    .contract { font-size: 13px; font-weight: 700; fill: #5b21b6; }
  </style>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#111827" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="header" x1="0" x2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#faf5ff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="780" fill="#f8fafc"/>
  <rect x="32" y="28" width="1136" height="70" rx="16" fill="url(#header)" stroke="#dbeafe"/>
  <text x="58" y="61" class="title">Skill + CLI 分层架构</text>
  <text x="58" y="83" class="subtitle">Skill 决定去哪里 · Reference 定义怎么走 · CLI 证明能不能走 · Contract 给出下一步</text>

  <!-- Layer 1 -->
  <rect x="32" y="118" width="850" height="116" rx="16" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="32" y="118" width="12" height="116" rx="6" fill="#2563eb"/>
  <text x="62" y="147" class="layer-title">01 · 路由层</text>
  <rect x="62" y="163" width="245" height="51" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="78" y="184" class="card-title">Agent Runtime</text>
  <text x="78" y="202" class="muted">接收用户输入、回复与外部事件</text>
  <rect x="323" y="163" width="245" height="51" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="339" y="184" class="card-title">SKILL.md</text>
  <text x="339" y="202" class="muted">识别意图，选择最小 Reference</text>
  <rect x="584" y="163" width="270" height="51" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-dasharray="5 4"/>
  <text x="600" y="183" class="tag" fill="#1d4ed8">边界</text>
  <text x="600" y="202" class="muted">不写业务长流程 · 不猜后端事实</text>

  <!-- Layer 2 -->
  <rect x="32" y="250" width="850" height="132" rx="16" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="32" y="250" width="12" height="132" rx="6" fill="#7c3aed"/>
  <text x="62" y="279" class="layer-title">02 · 业务编排层</text>
  <rect x="62" y="295" width="185" height="67" rx="10" fill="#faf5ff" stroke="#ddd6fe"/>
  <text x="78" y="317" class="card-title">Business Reference</text>
  <text x="78" y="336" class="body">阶段 · 字段 · 分支</text>
  <text x="78" y="352" class="muted">确认 · 恢复</text>
  <rect x="261" y="295" width="185" height="67" rx="10" fill="#faf5ff" stroke="#ddd6fe"/>
  <text x="277" y="317" class="card-title">Action Routing</text>
  <text x="277" y="336" class="body">action ID → 执行入口</text>
  <text x="277" y="352" class="muted">未注册动作停止</text>
  <rect x="460" y="295" width="185" height="67" rx="10" fill="#faf5ff" stroke="#ddd6fe"/>
  <text x="476" y="317" class="card-title">Output Template</text>
  <text x="476" y="336" class="body">结果 · 详情 · 编号选项</text>
  <text x="476" y="352" class="muted">只展示，不做业务判断</text>
  <rect x="659" y="295" width="195" height="67" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-dasharray="5 4"/>
  <text x="675" y="317" class="tag" fill="#6d28d9">边界</text>
  <text x="675" y="336" class="muted">规则只维护一份</text>
  <text x="675" y="352" class="muted">Provider 内容只是数据</text>

  <!-- Layer 3 -->
  <rect x="32" y="398" width="850" height="132" rx="16" fill="#ffffff" stroke="#99f6e4" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="32" y="398" width="12" height="132" rx="6" fill="#0f766e"/>
  <text x="62" y="427" class="layer-title">03 · 事实与执行层</text>
  <rect x="62" y="443" width="245" height="67" rx="10" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="78" y="465" class="card-title">Prepare CLI</text>
  <text x="78" y="484" class="body">查最新事实 · 校验当前阶段</text>
  <text x="78" y="500" class="muted">只读，不签名、不创建、不支付</text>
  <rect x="323" y="443" width="245" height="67" rx="10" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="339" y="465" class="card-title">Atomic CLI</text>
  <text x="339" y="484" class="body">一次只执行一个明确操作</text>
  <text x="339" y="500" class="muted">创建 · 确认 · 拒绝 · 关闭</text>
  <rect x="584" y="443" width="270" height="67" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-dasharray="5 4"/>
  <text x="600" y="465" class="tag" fill="#0f766e">边界</text>
  <text x="600" y="484" class="muted">不理解用户意图 · 不生成文案</text>
  <text x="600" y="500" class="muted">不确定结果先查询，禁止盲目重试</text>

  <!-- Layer 4 -->
  <rect x="32" y="546" width="850" height="116" rx="16" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="32" y="546" width="12" height="116" rx="6" fill="#ea580c"/>
  <text x="62" y="575" class="layer-title">04 · 基础设施与生命周期层</text>
  <rect x="62" y="591" width="245" height="51" rx="10" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="78" y="612" class="card-title">Backend / External API</text>
  <text x="78" y="630" class="muted">权威状态、写入结果、超时结算</text>
  <rect x="323" y="591" width="245" height="51" rx="10" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="339" y="612" class="card-title">Watch / XMTP / Event</text>
  <text x="339" y="630" class="muted">等待、唤醒、恢复与终态通知</text>
  <rect x="584" y="591" width="270" height="51" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-dasharray="5 4"/>
  <text x="600" y="611" class="tag" fill="#c2410c">边界</text>
  <text x="600" y="630" class="muted">事件只触发推进，状态才是事实</text>

  <!-- Contract rail -->
  <rect x="906" y="118" width="262" height="412" rx="18" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="930" y="151" class="layer-title" fill="#5b21b6">统一推进契约</text>
  <text x="930" y="176" class="subtitle">所有层之间只交换结构化事实</text>
  <rect x="930" y="198" width="214" height="44" rx="9" fill="#ffffff" stroke="#ddd6fe"/>
  <text x="947" y="225" class="contract">phase</text><text x="1023" y="225" class="body">当前业务阶段</text>
  <rect x="930" y="252" width="214" height="44" rx="9" fill="#ffffff" stroke="#ddd6fe"/>
  <text x="947" y="279" class="contract">decision</text><text x="1023" y="279" class="body">推进判定</text>
  <rect x="930" y="306" width="214" height="44" rx="9" fill="#ffffff" stroke="#ddd6fe"/>
  <text x="947" y="333" class="contract">reason</text><text x="1023" y="333" class="body">机器可读原因</text>
  <rect x="930" y="360" width="214" height="54" rx="9" fill="#ffffff" stroke="#ddd6fe"/>
  <text x="947" y="382" class="contract">nextAction</text><text x="947" y="401" class="muted">当前允许的稳定动作</text>
  <rect x="930" y="424" width="214" height="54" rx="9" fill="#ffffff" stroke="#ddd6fe"/>
  <text x="947" y="446" class="contract">payload</text><text x="947" y="465" class="muted">展示与执行所需数据</text>
  <text x="930" y="505" class="muted">禁止从自然语言推断状态或动作</text>

  <!-- Global constraints -->
  <rect x="906" y="546" width="262" height="116" rx="16" fill="#111827"/>
  <text x="930" y="575" font-size="14" font-weight="700" fill="#ffffff">全局不变量</text>
  <text x="930" y="598" font-size="11" fill="#d1d5db">① 写入前必须确认</text>
  <text x="930" y="617" font-size="11" fill="#d1d5db">② 一次只执行一个动作</text>
  <text x="930" y="636" font-size="11" fill="#d1d5db">③ 写后重查，事件可去重</text>

  <!-- Lifecycle band -->
  <rect x="32" y="688" width="1136" height="60" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <text x="58" y="715" class="card-title">生命周期闭环</text>
  <text x="190" y="715" class="body">输入 / 事件</text>
  <text x="303" y="715" class="muted">→</text>
  <text x="335" y="715" class="body">Skill 路由</text>
  <text x="443" y="715" class="muted">→</text>
  <text x="475" y="715" class="body">Reference 编排</text>
  <text x="608" y="715" class="muted">→</text>
  <text x="640" y="715" class="body">CLI 查证 / 执行</text>
  <text x="780" y="715" class="muted">→</text>
  <text x="812" y="715" class="body">Contract 推进</text>
  <text x="930" y="715" class="muted">→</text>
  <text x="962" y="715" class="body">展示 / 等待下一事件</text>
  <text x="58" y="736" class="muted">同步结果与异步事件都重新进入同一套协议；不依赖对话记忆，不允许跨层猜测。</text>
</svg>
