<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1100" width="1400" height="1100">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .title { font-size: 27px; font-weight: 700; fill: #111827; }
    .subtitle { font-size: 13px; fill: #6b7280; }
    .step { font-size: 12px; font-weight: 700; fill: #ffffff; }
    .name { font-size: 19px; font-weight: 700; fill: #111827; }
    .role { font-size: 13px; font-weight: 700; }
    .body { font-size: 12px; fill: #374151; }
    .muted { font-size: 11px; fill: #6b7280; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; fill: #1f2937; }
    .chain { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; fill: #1f2937; }
    .example-title { font-size: 14px; font-weight: 700; fill: #111827; }
    .arrow-label { font-size: 11px; font-weight: 700; fill: #6b7280; }
  </style>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#111827" flood-opacity="0.09"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
    <linearGradient id="header" x1="0" x2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="0.5" stop-color="#faf5ff"/>
      <stop offset="1" stop-color="#f0fdfa"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="1100" fill="#f8fafc"/>
  <rect x="36" y="28" width="1328" height="76" rx="18" fill="url(#header)" stroke="#dbeafe"/>
  <text x="64" y="61" class="title">四个核心构件，如何协作</text>
  <text x="64" y="85" class="subtitle">同一个业务事实，依次完成：识别与路由 → 定义推进规则 → 查证并返回结构 → 统一展示与交互</text>

  <!-- relationship labels -->
  <line x1="345" y1="295" x2="371" y2="295" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="358" y="278" text-anchor="middle" class="arrow-label">路由</text>
  <line x1="677" y1="295" x2="703" y2="295" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="690" y="278" text-anchor="middle" class="arrow-label">调用</text>
  <line x1="1009" y1="295" x2="1035" y2="295" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1022" y="278" text-anchor="middle" class="arrow-label">渲染</text>

  <!-- SKILL -->
  <rect x="36" y="130" width="309" height="330" rx="18" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="36" y="130" width="309" height="58" rx="18" fill="#eff6ff"/>
  <circle cx="67" cy="159" r="17" fill="#2563eb"/><text x="67" y="164" text-anchor="middle" class="step">1</text>
  <text x="94" y="166" class="name">SKILL.md</text>
  <text x="58" y="219" class="role" fill="#1d4ed8">角色：入口与路由器</text>
  <text x="58" y="246" class="body">放什么</text>
  <text x="74" y="268" class="muted">• 能力边界与适用意图</text>
  <text x="74" y="288" class="muted">• Envelope 优先级</text>
  <text x="74" y="308" class="muted">• Reference 选择规则</text>
  <text x="58" y="340" class="body">不放什么</text>
  <text x="74" y="362" class="muted">• API 细节与业务长流程</text>
  <text x="74" y="382" class="muted">• 后端状态判断</text>
  <rect x="58" y="403" width="265" height="35" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="72" y="425" class="code">event → 最小相关 Reference</text>

  <!-- Reference -->
  <rect x="368" y="130" width="309" height="330" rx="18" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="368" y="130" width="309" height="58" rx="18" fill="#faf5ff"/>
  <circle cx="399" cy="159" r="17" fill="#7c3aed"/><text x="399" y="164" text-anchor="middle" class="step">2</text>
  <text x="426" y="166" class="name">Business Reference</text>
  <text x="390" y="219" class="role" fill="#6d28d9">角色：业务流程说明书</text>
  <text x="390" y="246" class="body">放什么</text>
  <text x="406" y="268" class="muted">• 阶段、字段与来源</text>
  <text x="406" y="288" class="muted">• 分支、确认与恢复</text>
  <text x="406" y="308" class="muted">• 当前阶段调用哪个 CLI</text>
  <text x="390" y="340" class="body">不放什么</text>
  <text x="406" y="362" class="muted">• 通用输出模板</text>
  <text x="406" y="382" class="muted">• 重复的全局路由规则</text>
  <rect x="390" y="403" width="265" height="35" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="404" y="425" class="code">阶段 → 命令 + 约束</text>

  <!-- CLI -->
  <rect x="700" y="130" width="309" height="330" rx="18" fill="#ffffff" stroke="#5eead4" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="700" y="130" width="309" height="58" rx="18" fill="#f0fdfa"/>
  <circle cx="731" cy="159" r="17" fill="#0f766e"/><text x="731" y="164" text-anchor="middle" class="step">3</text>
  <text x="758" y="166" class="name">CLI</text>
  <text x="722" y="219" class="role" fill="#0f766e">角色：事实检查器与执行器</text>
  <text x="722" y="246" class="body">放什么</text>
  <text x="738" y="268" class="muted">• 查询权威状态</text>
  <text x="738" y="288" class="muted">• 前置校验与单次写入</text>
  <text x="738" y="308" class="muted">• 结构化推进结果</text>
  <text x="722" y="340" class="body">不放什么</text>
  <text x="738" y="362" class="muted">• 用户意图理解</text>
  <text x="738" y="382" class="muted">• 平台相关展示文案</text>
  <rect x="722" y="403" width="265" height="35" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="736" y="425" class="code">事实 → Progression Contract</text>

  <!-- Template -->
  <rect x="1032" y="130" width="332" height="330" rx="18" fill="#ffffff" stroke="#fdba74" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="1032" y="130" width="332" height="58" rx="18" fill="#fff7ed"/>
  <circle cx="1063" cy="159" r="17" fill="#ea580c"/><text x="1063" y="164" text-anchor="middle" class="step">4</text>
  <text x="1090" y="166" class="name">Output Template</text>
  <text x="1054" y="219" class="role" fill="#c2410c">角色：跨平台展示适配器</text>
  <text x="1054" y="246" class="body">放什么</text>
  <text x="1070" y="268" class="muted">• Result / Details / Next</text>
  <text x="1070" y="288" class="muted">• 表格、列表和编号规则</text>
  <text x="1070" y="308" class="muted">• 多平台一致表达</text>
  <text x="1054" y="340" class="body">不放什么</text>
  <text x="1070" y="362" class="muted">• 是否允许执行的判断</text>
  <text x="1070" y="382" class="muted">• 未注册的下一步动作</text>
  <rect x="1054" y="403" width="288" height="35" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="1068" y="425" class="code">Contract → 用户可读交互</text>

  <!-- Real example -->
  <rect x="36" y="492" width="1328" height="570" rx="20" fill="#ffffff" stroke="#d1d5db" filter="url(#shadow)"/>
  <text x="62" y="526" class="example-title">真实案例：创建任务后，状态为什么能继续流转</text>
  <text x="62" y="548" class="muted">每一轮都由用户动作或外部事件触发；触发后重新进入 SKILL.md，CLI 查证权威状态，再返回下一组 nextAction。</text>

  <!-- Round 1 trigger -->
  <rect x="62" y="568" width="1276" height="38" rx="9" fill="#111827"/>
  <text x="82" y="592" font-size="12" font-weight="700" fill="#ffffff">触发 ① 用户请求：使用已选择的服务 sid=35153 创建任务</text>

  <line x1="347" y1="647" x2="371" y2="647" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="658" y1="647" x2="682" y2="647" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1000" y1="647" x2="1024" y2="647" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="62" y="620" width="285" height="58" rx="11" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="78" y="645" class="chain">创建任务 → identity/search.md</text>
  <text x="78" y="663" class="muted">识别意图，选择创建入口</text>
  <rect x="373" y="620" width="285" height="58" rx="11" fill="#faf5ff" stroke="#ddd6fe"/>
  <text x="389" y="645" class="chain">task-create-prepare --sid 35153</text>
  <text x="389" y="663" class="muted">规定先做创建前校验</text>
  <rect x="684" y="620" width="316" height="58" rx="11" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="700" y="645" class="chain">ready + [open_create_playbook]</text>
  <text x="700" y="663" class="muted">允许进入参数与确认阶段</text>
  <rect x="1026" y="620" width="312" height="58" rx="11" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="1042" y="645" class="chain">任务卡：1. 确认创建  2. 取消</text>
  <text x="1042" y="663" class="muted">等待明确用户选择</text>

  <!-- Round 2 trigger -->
  <rect x="62" y="696" width="1276" height="38" rx="9" fill="#fff7ed" stroke="#fdba74"/>
  <text x="82" y="720" font-size="12" font-weight="700" fill="#c2410c">触发 ② 用户回复“1”明确确认创建 → 重新进入 Skill</text>

  <line x1="347" y1="775" x2="371" y2="775" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="658" y1="775" x2="682" y2="775" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1000" y1="775" x2="1024" y2="775" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="62" y="748" width="285" height="58" rx="11" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="78" y="773" class="chain">open_create_playbook → Action Routing</text>
  <text x="78" y="791" class="muted">只接受最新选项中的 action</text>
  <rect x="373" y="748" width="285" height="58" rx="11" fill="#faf5ff" stroke="#ddd6fe"/>
  <text x="389" y="773" class="chain">a2a/user/create.md → create-task</text>
  <text x="389" y="791" class="muted">参数完整且确认有效才允许写入</text>
  <rect x="684" y="748" width="316" height="58" rx="11" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="700" y="773" class="chain">write once → {jobId:123, status:created}</text>
  <text x="700" y="791" class="muted">CLI 创建一次并返回权威任务标识</text>
  <rect x="1026" y="748" width="312" height="58" rx="11" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="1042" y="773" class="chain">任务 123 已创建，等待 ASP 接单</text>
  <text x="1042" y="791" class="muted">进入异步等待，不重复创建</text>

  <!-- Round 3 trigger -->
  <rect x="62" y="824" width="1276" height="38" rx="9" fill="#faf5ff" stroke="#c4b5fd"/>
  <text x="82" y="848" font-size="12" font-weight="700" fill="#6d28d9">触发 ③ XMTP 收到系统事件 provider_applied(jobId=123) → 重新进入 Skill</text>

  <line x1="347" y1="903" x2="371" y2="903" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="658" y1="903" x2="682" y2="903" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1000" y1="903" x2="1024" y2="903" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="62" y="876" width="285" height="58" rx="11" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="78" y="901" class="chain">provider_applied → Lifecycle Reference</text>
  <text x="78" y="919" class="muted">结构化事件优先路由</text>
  <rect x="373" y="876" width="285" height="58" rx="11" fill="#faf5ff" stroke="#ddd6fe"/>
  <text x="389" y="901" class="chain">Prepare CLI：重查 task 123</text>
  <text x="389" y="919" class="muted">规定先重查任务状态</text>
  <rect x="684" y="876" width="316" height="58" rx="11" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="700" y="901" class="chain">requires_user_input + [confirm, reject]</text>
  <text x="700" y="919" class="muted">status=created 时才允许处理申请</text>
  <rect x="1026" y="876" width="312" height="58" rx="11" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="1042" y="901" class="chain">ASP 申请接单：1. 确认  2. 拒绝</text>
  <text x="1042" y="919" class="muted">用户选择将触发下一轮</text>

  <!-- Principle -->
  <rect x="62" y="956" width="1276" height="78" rx="13" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="82" y="984" class="example-title">状态推进规则</text>
  <text x="220" y="984" class="body">触发器（用户选择 / 外部事件）</text>
  <text x="444" y="984" class="muted">→</text>
  <text x="474" y="984" class="body">重新进入 Skill</text>
  <text x="600" y="984" class="muted">→</text>
  <text x="630" y="984" class="body">CLI 查询权威状态</text>
  <text x="784" y="984" class="muted">→</text>
  <text x="814" y="984" class="body">返回 nextAction</text>
  <text x="945" y="984" class="muted">→</text>
  <text x="975" y="984" class="body">展示并等待下一触发器</text>
  <text x="82" y="1014" class="muted">状态不会因为文档或对话自动流转；只有明确触发器启动新一轮，CLI 校验通过后才允许执行下一步。</text>
</svg>
